<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimBridge Test Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status.mock {
            background: #fff3cd;
            color: #856404;
        }

        .test-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .test-section:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .test-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 1.5em;
        }

        input, button {
            font-family: inherit;
            font-size: 1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 12px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #20bf6b 0%, #26de81 100%);
        }

        button.danger {
            background: linear-gradient(135deg, #eb3b5a 0%, #fc5c65 100%);
        }

        .response {
            background: #212529;
            color: #0f0;
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: none;
        }

        .response.show {
            display: block;
        }

        .response.error {
            color: #ff6b6b;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .architecture {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .architecture code {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌉 SimBridge Test Console</h1>
        <p class="subtitle">Testing gRPC Bridge between React Frontend and .NET 4.8 Tecnomatix Backend</p>
        
        <div class="architecture">
            <strong>Architecture:</strong> 
            <code>Browser</code> → 
            <code>REST :3001</code> → 
            <code>gRPC :50051</code> → 
            <code>.NET 4.8</code> → 
            <code>Tecnomatix</code>
        </div>

        <div id="connection-status" class="status disconnected">⚠️ Not Connected</div>

        <!-- Ping Test -->
        <div class="test-section">
            <h2><span class="icon">🏓</span> Connection Test</h2>
            <button onclick="testPing()">Ping Server</button>
            <div id="ping-response" class="response"></div>
        </div>

        <!-- Load Study -->
        <div class="test-section">
            <h2><span class="icon">📂</span> Load Simulation Study</h2>
            <input type="text" id="study-path" placeholder="Enter study path (e.g., C:\Studies\MyStudy.cojt)" value="C:\Studies\Sample.cojt">
            <button onclick="testLoadStudy()">Load Study</button>
            <div id="load-response" class="response"></div>
        </div>

        <!-- Signal Values -->
        <div class="test-section">
            <h2><span class="icon">📊</span> Signal Monitoring</h2>
            <input type="text" id="signal-names" placeholder="Enter signal names (comma separated)" value="conveyor_speed,robot_status,cycle_time">
            <button onclick="testGetSignals()">Get Signal Values</button>
            <div id="signal-response" class="response"></div>
        </div>

        <!-- Simulation Control -->
        <div class="test-section">
            <h2><span class="icon">▶️</span> Simulation Control</h2>
            <div class="controls">
                <button class="secondary" onclick="testRunSimulation('START')">Start</button>
                <button class="danger" onclick="testRunSimulation('STOP')">Stop</button>
                <button onclick="testRunSimulation('RESET')">Reset</button>
                <button onclick="testRunSimulation('STEP_FORWARD')">Step Forward</button>
            </div>
            <div id="sim-response" class="response"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';

        // Test connection on load
        window.addEventListener('load', () => {
            testPing();
        });

        async function showResponse(elementId, promise, isError = false) {
            const element = document.getElementById(elementId);
            element.classList.add('show');
            element.classList.toggle('error', isError);
            
            try {
                const data = await promise;
                element.textContent = JSON.stringify(data, null, 2);
                return data;
            } catch (error) {
                element.classList.add('error');
                element.textContent = `Error: ${error.message}`;
                throw error;
            }
        }

        async function testPing() {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = '🔄 Connecting...';
            statusEl.className = 'status disconnected';

            try {
                const response = await fetch(`${API_BASE}/ping`);
                const data = await response.json();
                
                await showResponse('ping-response', Promise.resolve(data));
                
                statusEl.textContent = data.message.includes('Mock') 
                    ? '🔶 Connected (Mock Mode)' 
                    : '✅ Connected (Tecnomatix)';
                statusEl.className = data.message.includes('Mock') 
                    ? 'status mock' 
                    : 'status connected';
            } catch (error) {
                statusEl.textContent = '❌ Connection Failed';
                statusEl.className = 'status disconnected';
                await showResponse('ping-response', Promise.reject(error), true);
            }
        }

        async function testLoadStudy() {
            const studyPath = document.getElementById('study-path').value;
            
            const promise = fetch(`${API_BASE}/load-study`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studyPath })
            }).then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            });

            await showResponse('load-response', promise);
        }

        async function testGetSignals() {
            const signalNames = document.getElementById('signal-names').value
                .split(',')
                .map(s => s.trim())
                .filter(s => s);
            
            const promise = fetch(`${API_BASE}/get-signals`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ signalNames })
            }).then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            });

            await showResponse('signal-response', promise);
        }

        async function testRunSimulation(action) {
            const promise = fetch(`${API_BASE}/run-simulation`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, speed: 1.0 })
            }).then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            });

            await showResponse('sim-response', promise);
        }
    </script>
</body>
</html>
